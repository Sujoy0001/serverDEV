services:
  app:
    build: .
    container_name: fastapi_app
    expose:
      - "8000"
    environment:
      PYTHONUNBUFFERED: "1"

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
